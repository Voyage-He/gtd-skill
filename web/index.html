<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="管理本机 GTD 任务与资料"><title>GTD · 工作台</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><aside><div class="brand">G<span>TD</span><small>个人工作台</small></div><nav id="nav" aria-label="分类"></nav><div class="connection"><i></i> 本机数据<small id="directory"></small></div></aside><main><header><div><p class="eyebrow">整理思绪，专注行动</p><h1 id="heading">收集箱</h1></div><button id="create" class="primary">＋ 新建</button></header><section class="toolbar"><input id="search" type="search" placeholder="搜索标题、正文、标签或编号…" aria-label="搜索"><label><input id="show-done" type="checkbox"> 显示已完成</label><button id="refresh">刷新</button></section><p id="status" role="status" aria-live="polite"></p><section id="list" aria-label="记录列表"></section><footer>与对话共用数据 · 切回窗口时自动刷新</footer></main>
<dialog id="editor"><form id="form"><div class="dialog-head"><h2 id="dialog-title">新建</h2><button type="button" id="close" aria-label="关闭">✕</button></div><div id="fields"></div><p id="form-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel">取消</button><button type="submit" class="primary">保存</button></div></form></dialog>
</body></html>
