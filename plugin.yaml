name: gtd
version: "2.0.0"
description: >
  Hermes Agent GTD plugin for capturing, organizing, reviewing, and completing
  work in a Markdown-based Getting Things Done system.
provides_tools:
  - gtd_init
  - gtd_capture
  - gtd_inbox
  - gtd_inbox_process
  - gtd_next_number
  - gtd_list_actions
  - gtd_complete
  - gtd_archive
  - gtd_daily_check
  - gtd_weekly_review
  - gtd_stats
  - gtd_config_get
  - gtd_config_set
  - gtd_reference_add
  - gtd_reference_search
  - gtd_reference_get
  - gtd_reference_link
  - gtd_reference_read
requires_env:
  - name: GTD_DIR
    required: false
    description: Optional GTD data directory. Defaults to ~/gtd when unset.
